# RTP Server Configuration File
# This file contains all configuration parameters for the RTP server application
#
# OVERVIEW:
# The RTP Server is a GStreamer-based RTP streaming server that:
# 1. Listens for client connections on a handshake port
# 2. Dynamically allocates RTP ports for video streaming
# 3. Receives H.265 encoded video streams via RTP
# 4. Decodes and displays video streams
# 5. Saves decoded streams to H.265 files
# 6. Optionally forwards streams to RTP output destinations
# 7. Monitors stream quality (packet loss, jitter, silence)

[Server]
# SERVER PARAMETERS
# These parameters control the basic server operation and client connection handling.

# Handshake port for client connections
# This is the RTP input handshake port where the server listens for new client connection requests
# When a client connects, the server dynamically allocates a new RTP port for video streaming
#
# Valid range: 1-65535
# Common ports: 5000-5010 (standard RTP range)
# Default: 5000
#
# Example configurations:
#   5000  - Default handshake port
#   5004  - Alternative port (if 5000 is in use)
#   6000  - Custom port
handshake_port = 5000

# Transport type
# Options: rtp, webrtc
# Default: rtp
#
#   rtp    - RTP input transport with binary handshake protocol (default)
#   webrtc - WebRTC transport with signaling server
transport_type = rtp

# Output directory for saving video files
# When specified, video streams will be saved to H.265 files in this directory
# If not specified or empty, files are not saved (display only)
#
# Examples:
#   /tmp/rtp_recordings  - Save to /tmp/rtp_recordings directory
#   ./recordings         - Save to ./recordings directory relative to current directory
#   (empty or not set)   - No file saving (display only)
#
# Note: The directory will be created automatically if it doesn't exist
#       File names are auto-generated with timestamp and port number
#       Format: rtp_stream_port<PORT>_<YYYYMMDD_HHMMSS>_<ms>.h265
#output_directory =

[Common]
# COMMON PARAMETERS
# These parameters are shared across different components.

# Background color for empty buffers
# This color is used when initializing empty video buffers
# Value is a 32-bit integer representing the color
# Default: 0
background_color = 0

# Video width/height for inference configuration
# These values are used to select and configure YOLO models at startup.
# Leave empty to use defaults or model-specific config values.
width = 640
height = 480

[WebRTC]
# WEBRTC PARAMETERS
# These parameters are only used when transport_type=webrtc

# Signaling mode
# Options: embedded, external
# Default: embedded
#
#   embedded - Server acts as signaling server (simpler deployment)
#   external  - Connect to external signaling server
signaling_mode = embedded

# Signaling port (for embedded mode)
# WebSocket port for signaling server
# Valid range: 1-65535
# Default: 8080
signaling_port = 8080

# Use SSL for signaling (for embedded mode)
# Enable WSS (WebSocket Secure) instead of WS
# Default: false
signaling_use_ssl = false

# Signaling URL (for external mode)
# WebSocket URL for external signaling server (e.g., ws://127.0.0.1:8080)
# Leave empty if using embedded mode
signaling_url =

# STUN server URL (optional)
# STUN server for NAT traversal (e.g., stun:stun.l.google.com:19302)
# Leave empty to disable STUN
stun_server =

# TURN server URL (optional)
# TURN server for NAT traversal when STUN is insufficient
# Format: turn:host:port
# Leave empty to disable TURN
turn_server =

# TURN server username (optional)
# Required if turn_server is specified
turn_username =

# TURN server password (optional)
# Required if turn_server is specified
turn_password =

# ICE candidate timeout in milliseconds
# Timeout for ICE candidate gathering
# Default: 10000 (10 seconds)
ice_timeout_ms = 10000

[Monitoring]
# MONITORING PARAMETERS
# These parameters control RTP stream quality monitoring and quality checks.
# Monitoring helps detect and report issues with incoming video streams.

# Enable packet loss monitoring
# When enabled, the server monitors packet loss rates in incoming RTP streams
# and reports warnings if the loss rate exceeds the threshold
#
# Options:
#   true  - Enable packet loss monitoring
#   false - Disable packet loss monitoring (default)
#
# Use cases:
#   true  - Production environments, quality assurance, debugging network issues
#   false - Development, testing, when monitoring overhead is not needed
enable_packet_loss_check = false

# Enable jitter monitoring
# When enabled, the server monitors network jitter (variation in packet arrival times)
# and reports warnings if jitter exceeds the threshold
#
# Options:
#   true  - Enable jitter monitoring
#   false - Disable jitter monitoring (default)
#
# Use cases:
#   true  - Production environments, network quality assessment, debugging timing issues
#   false - Development, testing, when monitoring overhead is not needed
enable_jitter_check = false

# Enable silence detection monitoring
# When enabled, the server monitors for periods of silence (no data received)
# and reports warnings if silence duration exceeds the threshold
#
# Options:
#   true  - Enable silence detection monitoring
#   false - Disable silence detection monitoring (default)
#
# Use cases:
#   true  - Production environments, detecting stream interruptions, debugging connection issues
#   false - Development, testing, when monitoring overhead is not needed
enable_silence_check = false

# Maximum packet loss rate threshold (percentage)
# This threshold is only used when enable_packet_loss_check = true
# The server will report warnings if packet loss rate exceeds this value
#
# Range: 0.0 to 100.0 (percentage)
# Default: 5.0
#
# Typical values:
#   1.0-3.0  - Very strict, detects minor packet loss
#   5.0-10.0 - Balanced threshold (default: 5.0)
#   10.0-20.0 - Lenient threshold, only detects significant packet loss
#
# Note: Packet loss is normal in network transmission, but excessive loss
# can cause video quality degradation
max_packet_loss_rate = 5.0

# Maximum jitter threshold (milliseconds)
# This threshold is only used when enable_jitter_check = true
# The server will report warnings if jitter exceeds this value
#
# Range: 0.0 and above (milliseconds)
# Default: 50.0
#
# Typical values:
#   10.0-30.0  - Very strict, detects minor jitter (good for low-latency applications)
#   50.0-100.0 - Balanced threshold (default: 50.0)
#   100.0-200.0 - Lenient threshold, only detects significant jitter
#
# Note: Jitter is variation in packet arrival times. Higher jitter can cause
# playback issues and buffer underruns
max_jitter_ms = 50.0

# Maximum silence duration threshold (milliseconds)
# This threshold is only used when enable_silence_check = true
# The server will report warnings if silence duration exceeds this value
#
# Range: 1 and above (milliseconds)
# Default: 10000 (10 seconds)
#
# Typical values:
#   1000-5000   - Very strict, detects short interruptions (1-5 seconds)
#   10000-30000 - Balanced threshold (default: 10000 = 10 seconds)
#   30000-60000 - Lenient threshold, only detects long interruptions (30-60 seconds)
#
# Note: Silence detection helps identify when streams are interrupted or stopped
max_silence_ms = 10000

[RTPOutput]
# RTP OUTPUT PARAMETERS
# These parameters configure RTP output forwarding for H.265 RTP video streams.
# RTP output allows the server to forward video streams to other applications or systems.

# Enable RTP output forwarding
# When enabled, the server forwards H.265 RTP video streams to a specified destination
# This creates an additional output branch in the pipeline that encodes, RTP-payloads, and sends video through RTP output transport
#
# Options:
#   true  - Enable RTP output forwarding
#   false - Disable RTP output forwarding (default)
#
# Use cases:
#   true  - Forwarding streams to other systems, multi-destination streaming, integration with other applications
#   false - Standard operation, display and file saving only, reduces resource usage
enabled = false

# RTP output destination host address
# This is the IP address or hostname where RTP output packets will be sent
# This parameter is only used when enabled = true
#
# Common formats:
#   IP address: 192.168.1.100, 10.0.0.5
#   Hostname:   stream-forward.local, rtp-output-server.company.com
#   Localhost:  127.0.0.1, localhost
#
# Default: 127.0.0.1 (localhost)
#
# Example configurations:
#   127.0.0.1      - Send to localhost (for testing)
#   192.168.1.100  - Send to local network device
#   0.0.0.0        - Broadcast (if supported by network)
host = 127.0.0.1

# RTP output destination port number
# This is the RTP output destination port number where packets will be sent
# This parameter is only used when enabled = true
#
# Valid range: 1-65535
# Common RTP output ports: 5004-5010 (standard RTP range)
# Default: 5004
#
# Example configurations:
#   5004  - Default RTP output port
#   5006  - Alternative port
#   6000  - Custom port
#
# Note: The receiving application must listen on this port to receive the RTP output stream
port = 5004

# RTP payload type for forwarded H.265 stream
# Valid range: 0-127 (dynamic payloads commonly use 96)
# Default: 96
payload_type = 96

[Debug]
# DEBUG PARAMETERS
# These parameters control debugging and diagnostic features.

# Enable on-screen display sink output
# When disabled, a fakesink is used instead of nveglglessink so the pipeline runs headless.
# Options:
#   true  - Render to on-screen display sink (default)
#   false - Disable display rendering (headless sink)
enable_display_sink = true

# Enable bitrate display overlay
# When enabled, the server calculates and displays the current bitrate as an overlay
# on decoded video frames. The bitrate is calculated using a sliding window approach
# and displayed in the lower right corner of the video.
#
# Options:
#   true  - Enable bitrate display overlay
#   false - Disable bitrate display overlay (default)
#
# Use cases:
#   true  - Debugging bitrate issues, monitoring stream quality, development
#   false - Production environments, when overlay is not needed
draw_bitrate = true

# Enable large red bitrate display overlay
# When enabled, the server calculates and displays the current bitrate as an overlay
# on decoded video frames. The bitrate is displayed at 2x the normal size and in red color
# in the lower right corner of the video.
#
# Options:
#   true  - Enable large red bitrate display overlay
#   false - Disable large red bitrate display overlay (default)
#
# Use cases:
#   true  - When larger, more visible bitrate display is needed
#   false - Use normal bitrate overlay or disable overlay
draw_bitrate_large = false

# Enable FPS display overlay
# When enabled, the server calculates and displays the current playback FPS as an overlay
# on decoded frames. The FPS value is displayed in the top right corner of the video.
#
# Options:
#   true  - Enable FPS display overlay
#   false - Disable FPS display overlay (default)
#
# Use cases:
#   true  - Debugging performance issues, monitoring frame rate, development
#   false - Production environments, when overlay is not needed
draw_fps = true

# Save final reconstructed frames as PNG files for debugging
# When enabled, frames are saved after PRI reconstruction and optional TET processing.
# Frames are captured from the display path after OSD overlays.
# Borders therefore follow display/inference settings (not PRI-specific debug drawing).
# Output path:
#   - If [Server] output_directory is set: <output_directory>/debug_frames/port_<PORT>/
#   - Otherwise: <config_file_directory>/debug_frames/port_<PORT>/
# File name pattern: frame_000001.png
save_frames = false

[TET]
# TET PARAMETERS
# These parameters control Tile Enhancement Tiles (TET) post-processing.
# When enabled, the server applies learned tile patterns after PRI processing.
enabled = true
# Path to a .tet tile file (generated from a .pkl using the converter script).
# Use a YUV tile when processing I420 frames.
tile_file = tiles/yuv_32x32_checkerboard.tet
# Fallback QP for selecting the closest tile if metadata QP is unavailable.
qp = 27
# Enable dynamic QP extraction from the encoded stream (SPS/PPS).
dynamic_qp = true

[Decoder]
# DECODER FACTORY PARAMETERS
# Optional GStreamer H.265 decoder element name. Default is nvh265dec (desktop).
# openhevcdec = software decoder (gst-openhevc), ensure plugin path is available via GST_PLUGIN_PATH.
# Only registered names are accepted; unsupported names exit at startup.
# CLI --decoder-element overrides this value.
#element = openhevcdec

[Inference]
# INFERENCE PARAMETERS
# These parameters control DeepStream inference in the display branch.
#
# Enable inference engine (nvinfer) for detection.
inference_engine = true
#
# DeepStream YAML config for inference (e.g. ../yolo/yolo_config_11m.yml)
deepstream_config_file = ../yolo/yolo_config_11x.yml
#
# Deprecated semseg keys (kept for backward compatibility only).
# AH0187 semseg runs are orchestrated by scripts/run_tet_comparison.sh.
semseg_deepstream_config_file =
#
# Deprecated semseg model/engine/labels inputs used by legacy generators.
semseg_model_file =
semseg_engine_file =
semseg_labels_file =
# Deprecated profile suffix for generated semseg config names.
semseg_profile = default
#
# Optional comma-separated labels filter (e.g. person,car). Leave empty for all.
labels = person,car,traffic light

[TestMode]
# TEST MODE PARAMETERS
# These parameters enable detection accuracy testing against groundtruth.
#
# Path to COCO-style groundtruth JSON file. Leave empty to disable.
groundtruth_file =
#
# IoU threshold for matching detections to groundtruth (0.0 - 1.0)
iou_threshold = 0.5

# Optional markdown output file for final test mode summary
# Example: /tmp/test_mode_summary.md
output_md =

# Optional json output file for final test mode summary
# Example: /tmp/test_mode_summary.json
output_json =

[Tracker]
# TRACKER PARAMETERS
# These parameters control DeepStream tracking (nvtracker) in the display branch.
tracker_enabled = true
tracker_config_file =
tracker_ll_lib_file = /opt/nvidia/deepstream/deepstream/lib/libnvds_nvmultiobjecttracker.so

[Borders]
# BORDER PARAMETERS
# These parameters control border drawing on decoded display frames.
draw_borders = true
border_width = 2
