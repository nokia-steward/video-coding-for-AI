# Encoder Configuration File
# This file contains all configuration parameters for the encoder CLI application
#
# OVERVIEW:
# This encoder supports three input modes:
# 1. FILE MODE: Processes pre-recorded video files (YUV format)
# 2. CAMERA MODE: Captures live video from camera devices
# 3. UDP MODE: Receives RTP streams (H.264/H.265) via udpsrc
#
# The input_type parameter determines which mode is used and which other parameters are required.
# When input_type = "file", the [Video] section parameters are used.
# When input_type = "camera", the [Camera] section parameters are used.

[Common]
# Input type determines the source of video data
# Options:
#   "file"   - Process pre-recorded video files (YUV format)
#   "camera" - Capture live video from camera devices
#   "udp"    - Receive RTP video over UDP and decode to raw frames
#
# This parameter controls which other configuration sections are active:
# - "file": Uses [Video] section parameters, ignores [Camera]/[UDP] sections
# - "camera": Uses [Camera] section parameters, ignores [Video]/[UDP] sections
# - "udp": Uses [UDP] section parameters, ignores [Video]/[Camera] sections
input_type = udp

# Common video properties used by all input types
# These values are used for:
# - Memory allocation for frame buffers
# - GStreamer pipeline configuration
# - ROI coordinate validation
# - Timing calculations in the pipeline
# - ROI temporal resampling calculations
# - Bitrate calculations
#
# For file input: These values are automatically parsed from the input video filename by run.sh
# Format: filename_WIDTHxHEIGHT_FRAMERATE.yuv
# Example: BasketballDrill_832x480_50.yuv -> width=832, height=480, framerate=50
#
# For camera input: These are the requested capture resolution and framerate
# The camera will negotiate the actual supported format
# Common resolutions: 1920x1080 (Full HD), 1280x720 (HD), 640x480 (VGA)
# Common framerates: 15, 25, 30, 60 fps
#
# For UDP input: These are the expected stream resolution and framerate after decoding
# These values are required for ROI processing and pipeline sizing
width = 640
height = 480
framerate = 30

# Background color for empty buffers
# This color is used when initializing empty video buffers
# Value is a 32-bit integer representing the color
# Default: 0
background_color = 0

[Output]
# Output root directory for saved frame artifacts.
# Used by Debug.save_frames for:
#   - debug_frames/
#   - original_frames/
#
# Priority:
#   1) this value (or CLI --output-directory)
#   2) directory containing the active encoder_config.ini
#
# Leave empty to use the config file directory.
output_directory =

[Encoder]
# ENCODER FACTORY AND RATE CONTROL PARAMETERS
# These parameters select the GStreamer H.265 encoder element and control rate control mode.

# Encoder element (GStreamer factory name)
# Optional. When omitted or empty, the build default is used:
#   - Desktop (x86_64): nvh265enc
#   - Jetson (ARM64):   nvv4l2h265enc
#
# Only registered names are accepted; unsupported names or wrong platform cause
# startup failure with a clear error. CLI --encoder-element overrides this value.
#
# Registered values:
#   nvh265enc      - NVIDIA desktop H.265 encoder (CUDA path); desktop builds only
#   nvv4l2h265enc  - Jetson H.265 encoder (NVMM path); Jetson/ARM64 encoder builds only
#   kvazaarenc     - Kvazaar software H.265 encoder (system-memory I420); alias kvazaar
#                    Build/install the plugin into lib/kvazaar;
#                    setup adds only libgstkvazaarenc via an isolated plugin dir
#                    (symlink), not the whole plugin tree.
#                    On x86_64, UDP input always uses avdec_h265 -> videoconvert -> nvvideoconvert
#                    (including with nvh265enc): nvh265dec requires gst.cuda.context, which this
#                    pipeline does not supply, so NEED_CONTEXT leads to not-negotiated if used
#                    on the UDP path. ARM64 UDP keeps nvv4l2decoder.
#                    Display branch on x86_64 also uses avdec_h265 + videoconvert before upload:
#                    nvh265dec as d-disp rejects parser byte-stream caps -> sei_src not-negotiated.
#                    ARM64 display keeps nvv4l2decoder when not using kvazaar.
#
# Leave commented out to use the build default.
#element = kvazaar

# Constant QP mode
# When set, overrides bitrate-based CBR with constant-QP encoding.
# The same QP is applied to I, P, and B frames.
# Jetson (nvv4l2h265enc): applied via qp-range (not quant-range).
#
# Range: 0-51 (lower = higher quality / larger bitrate)
# Typical values:
#   22 - High quality, large bitrate
#   27 - Good quality, moderate bitrate
#   32 - Balanced quality/size
#   37 - Moderate compression
#   42 - High compression, visible artifacts
#   47 - Very high compression
#
# Leave commented out to use the default CBR mode (bitrate computed
# from resolution and framerate).
# qp = 37

[Video]
# VIDEO FILE INPUT PARAMETERS
# These parameters are ONLY used when input_type = "file"
# They define the properties of the input video file being processed.

# Path to the input video file (YUV format)
# Supported formats: I420, NV12, YV12, UYVY, YUY2
# The file must contain raw video data without container format
# Example paths: /path/to/video.yuv, /home/user/test_1920x1080_30.yuv
file_name =

# Raw video format specification
# Common formats:
#   I420  - Planar YUV 4:2:0 (most common, 12 bits per pixel)
#   NV12  - Semi-planar YUV 4:2:0 (12 bits per pixel)
#   YV12  - Planar YUV 4:2:0 with V and U swapped (12 bits per pixel)
#   UYVY  - Packed YUV 4:2:2 (16 bits per pixel)
#   YUY2  - Packed YUV 4:2:2 (16 bits per pixel)
# The format must match the actual data in the file
format = I420

[Camera]
# CAMERA INPUT PARAMETERS
# These parameters are ONLY used when input_type = "camera"
# They define the properties of the camera device being used for live capture.

# Camera device path
# Common Linux camera devices:
#   /dev/video0  - First camera device (most common)
#   /dev/video1  - Second camera device
#   /dev/video2  - Third camera device, etc.
# Use 'ls /dev/video*' to list available camera devices
# Use 'v4l2-ctl --list-devices' for detailed camera information
device = /dev/video0

[UDP]
# UDP INPUT PARAMETERS
# These parameters are ONLY used when input_type = "udp"
# They define the properties of an RTP stream received via GStreamer's udpsrc element.

# Bind address determines which local interface udpsrc listens on.
# Set to 0.0.0.0 to listen on all interfaces (default) or a specific local IP.
bind_address = 0.0.0.0

# UDP port to listen on for incoming RTP packets.
# This must match the sender's destination port.
port = 12300

# Encoding used in the RTP payload. Supported values: H264, H265
encoding = H265

# RTP payload type advertised by the sender (commonly 96 for dynamic payloads).
payload_type = 107

# RTP clock rate in Hz (typically 90000 for video streams).
clock_rate = 90000

# Jitter buffer latency in milliseconds to absorb network jitter.
latency_ms = 200

[ROI]
# REGION OF INTEREST (ROI) PROCESSING PARAMETERS
# These parameters control how regions of interest are detected, processed, and encoded.
# ROI processing allows focusing encoding resources on specific areas of the video frame.

# Path to DeepStream configuration file
# This file configures the DeepStream pipeline including nvinfer and nvtracker
# Supported formats:
#   .txt  - DeepStream configuration files
#
# This parameter is MUTUALLY EXCLUSIVE with data_file:
# - If deepstream_config_file is provided: AI detection is used to find ROIs
# - If data_file is provided: Pre-computed ROI data is loaded from file
# - If both are empty: No ROI processing is performed
deepstream_config_file = ../yolo/yolo_config_11s.yml

# Comma-separated list of object labels to detect
# Only used when detection_config_file is provided
# Common labels: person, car, bicycle, dog, cat, etc.
# The labels must match the classes supported by the detection model
# Multiple labels can be specified: "person,car,bicycle"
labels = person,car,traffic light

# YOLO model version and size
# Format: version number + size suffix (e.g., "8n", "11s", "5m")
# Supported versions: 5, 6, 7, 8, 9, 10, 11
# Supported sizes: n (nano), s (small), m (medium), l (large), x (xlarge)
# Examples:
#   "8n"  - YOLOv8 nano (default, fastest, least accurate)
#   "8s"  - YOLOv8 small
#   "11m" - YOLOv11 medium
#   "5n"  - YOLOv5 nano
# Default: "8n" (YOLOv8 nano)
yolo_version = 11s

# Path to pre-computed ROI data file
# This file contains ROI coordinates and metadata for each frame
# Format: JSON or custom binary format with frame-by-frame ROI data
#
# This parameter is MUTUALLY EXCLUSIVE with detection_config_file:
# - If data_file is provided: ROI data is loaded from this file
# - If detection_config_file is provided: AI detection generates ROI data
# - If both are empty: No ROI processing is performed
#
# When this file is provided, width, height, and framerate are automatically
# loaded from the file metadata, overriding the [Video] section values
data_file =

# Path to static ROI JSON file
# This file contains static ROI definitions in JSON format
# Format: JSON file with "rois" array containing objects with x, y, width, height
# Example: {"rois": [{"x": 0, "y": 0, "width": 640, "height": 480}]}
#
# Only ONE ROI source may be active at a time. The three ROI source options are
# mutually exclusive:
# - static_roi_json_file: Fixed ROIs applied to every frame
# - groundtruth_roi_file: Per-frame ROIs from COCO groundtruth JSON
# - inference_engine:     AI inference generates dynamic ROIs
# If more than one is provided, the application will exit with an error.
# If none are provided, no ROI processing is performed (passthrough mode).
#
# Static ROIs are applied to every frame and do not change over time.
# This is useful for fixed camera positions or known static regions.
static_roi_json_file =

# Path to COCO-format groundtruth JSON file for per-frame ROI detection
#
# When set, the encoder uses bounding boxes from the COCO groundtruth JSON as
# ROIs instead of running inference or using static ROIs. Each frame's ROIs
# are looked up by frame index from the annotations in the file.
#
# The COCO JSON must contain "images" and "annotations" arrays. Frame indices
# are derived from image filenames (e.g. "frame_042.jpg" -> frame 42) or from
# the positional order in the images array.
#
# This is primarily useful for TET evaluation tests where "perfect" ROIs
# (from groundtruth) are needed to isolate encoding effects from detection
# quality.
groundtruth_roi_file =

# Enable inference engine for dynamic ROI detection
# When enabled, uses AI-based detection to generate dynamic ROIs
# Options:
#   true  - Enable inference engine for dynamic ROI detection
#   false - Disable inference engine (default)
#
# Dynamic ROIs change over time based on detected objects or tracking results
# This is useful for moving cameras or dynamic scenes
inference_engine = true

# ROI packing strategy
# Controls how detected ROIs are arranged in the output frame:
#   true  - Pack ROIs into a compact layout to maximize encoding efficiency
#   false - Keep ROIs in their original positions (useful for debugging)
#
# Packing benefits:
# - Reduces encoded frame size by eliminating empty space
# - Improves compression efficiency
# - Allows higher quality encoding for the same bitrate
pack_rois = true

# Packer type for ROI packing algorithm
# Options:
#   "low_delay" - Low delay packer with ROI accumulation (default: 3 frames)
#   "random_access" - Random access packer with intraperiod buffering
# Default: "low_delay"
packer_type = low_delay

# Background processing mode
# Options:
#   off              - Disable background-specific processing (default)
#   background_blur  - Blur everything except ROIs
#   qp_map_delta     - Keep pixels unchanged and generate per-CTB QP deltas (+background delta)
# Notes:
# - Any non-off mode automatically disables pack_rois.
# - qp_map_delta is supported only on x86 desktop systems.
# - On non-x86 systems, startup fails with a validation error when qp_map_delta is requested.
# - On x86 systems, unsupported runtime encoder paths fall back to background_blur.
background_mode = background_blur

# QP delta for background-only CTBs in qp_map_delta mode
# Default: 10
qp_map_background_delta = 10

# Enables luma adaptation workflow:
# - Down-scales luma (Y plane) before encoding.
# - Emits EOI luma adaptation metadata in IRAP frames.
# Set to false to disable both behaviors.
enable_luma_adaptation = true

# Luma down-scale factor applied to the Y plane before encoding (used when enable_adaptive_luma_adaptation is false).
# Valid range: (0.0, 1.0]
# Example: 0.70 means pYl = floor(0.70 * pY)
luma_downscale_factor = 0.8

# When true, use the input-analyzer ONNX model to predict (d, u) per frame/keyframe instead of fixed luma_downscale_factor.
# Requires enable_luma_adaptation = true and a non-empty input_analyzer_model_path.
enable_adaptive_luma_adaptation = true

# Path to the adaptive luma input analyzer model (relative to the encoder_cli folder). Accepted: .pt or .onnx.
# .pt is auto-converted to .onnx by run.sh when the .onnx is missing or older than the .pt (requires: pip install torch torchvision).
# .onnx is used directly. Examples: yolo/model_weights.pt or ../yolo/model_weights.pt
input_analyzer_model_path = ../yolo/model_weights.pt

# When true (default), run the analyzer only on keyframes and reuse (d,u) for non-keyframes; when false, run every frame.
adaptive_luma_analyzer_on_keyframes_only = true

# Sigma (standard deviation) for Gaussian blur kernel
# Controls the blur strength - higher values = more blur
# Typical range: 0.5 to 5.0
# Default: 2.5
sigma = 2.5

# Kernel size for Gaussian blur
# If 0, automatically calculated from sigma as: 2 * ceil(3 * sigma) + 1
# Must be odd if explicitly set (e.g., 3, 5, 7, 9)
# Default: 0 (auto-calculate)
kernel_size = 0

# Number of frames to accumulate for low_delay packer
# Range: 1-10 (recommended: 3)
# This controls how many previous frames are used to accumulate ROIs for each object
# Higher values create larger accumulated ROIs but provide more stability
# Default: 3
num_frames = 5

# Fixed per-side ROI margin in pixels before CTU packing
# This margin is applied on each side: left/right/top/bottom.
# Example: 20 means x-=20, y-=20, w+=40, h+=40 before clamping.
# Default: 0 (disabled)
roi_fixed_margin_px = 20

# ROI margin mode controls where fixed margin is applied
# Options:
#   off        - Disable fixed-pixel margin
#   content    - Apply margin to copied/signaled ROI content and packing placement
#   placement  - Apply margin only for packing placement; copied/signaled content stays original
# Default: off
roi_margin_mode = content

# Temporal resampling factor for ROI data
# Controls how ROI data is sampled across time:
#   1     - Use ROI data for every frame (no resampling)
#   2     - Use ROI data for every 2nd frame (2x downsampling)
#   4     - Use ROI data for every 4th frame (4x downsampling)
#   etc.  - Higher values reduce ROI update frequency
#
# This is useful when:
# - ROI data has higher temporal resolution than needed
# - Reducing computational load for ROI processing
# - Smoothing ROI movements over time
#
# Example: If ROI data is at 50fps but you want 25fps updates, set to 2
temporal_resampling = 1

[Tracker]
# OBJECT TRACKING PARAMETERS
# These parameters configure object tracking for maintaining ROI consistency across frames.
# Tracking helps maintain stable ROI regions even when objects move or are temporarily occluded.

# Path to tracker configuration file
# This file configures the object tracking algorithm used to maintain ROI consistency
# If provided, this file will be used directly and other tracker parameters will be ignored.
# If left empty, the application will use tracker_type to select a default config file
# and apply the other tracker parameters below.
#
# Example paths:
#   NvSORT: /opt/nvidia/deepstream/deepstream/samples/configs/deepstream-app/config_tracker_NvSORT.yml
#   NvDCF:  /opt/nvidia/deepstream/deepstream/samples/configs/deepstream-app/config_tracker_NvDCF_perf.yml
tracker_config_file =

# Tracker type: IOU, NvSORT, NvDCF, or NvDeepSORT
# Only used if tracker_config_file is empty
#   IOU        - Simple IOU-based tracker (fast, less robust)
#   NvSORT     - NVIDIA's SORT implementation with Kalman filtering (recommended, balanced)
#   NvDCF      - Discriminative Correlation Filter tracker (good for visual tracking)
#   NvDeepSORT - Deep learning-based tracker (best for complex scenarios)
# Default: NvSORT
tracker_type = NvSORT

# Maximum shadow tracking age (frames to track after detection stops)
# Range: 1 to 100+ frames
# This is the most important parameter for handling object loss.
# Higher values allow objects to be tracked longer after detection stops,
# which helps with temporary occlusions and detection failures.
# Phase 5 optimization: Reduced from 40 → 10 for better performance on weaker systems
# Default: 40 frames (optimized: 10)
tracker_max_shadow_tracking_age = 10

# Enable trajectory re-association for lost tracks
# When enabled, the tracker will attempt to reconnect tracks that were temporarily lost.
# This is crucial for handling occlusions and detection failures.
# Phase 5 optimization: Disabled (false) to reduce computation overhead
# Default: true (optimized: false)
tracker_enable_reassoc = false

# Trajectory projection length (frames)
# Range: 10 to 200+ frames
# Controls how far ahead the tracker projects object trajectories when re-associating.
# Higher values allow longer occlusions to be handled.
# Phase 5 optimization: Reduced from 150 → 50 for lower latency
# Default: 150 frames (optimized: 50)
tracker_trajectory_projection_length = 50

# Maximum tracklet matching time search range (frames)
# Range: 5 to 50+ frames
# Time window for searching and matching tracklets during re-association.
# Higher values allow longer gaps between track segments to be connected.
# Phase 5 optimization: Reduced from 25 → 10 for faster processing
# Default: 25 frames (optimized: 10)
tracker_max_tracklet_matching_time_range = 10

# Maximum targets per stream
# Range: 1 to 300+ targets
# Limits the maximum number of objects tracked simultaneously per stream.
# Lower values reduce computation and memory usage, improving performance on weaker systems.
# Phase 5 optimization: Reduced from 300 → 100 (67% reduction) for weaker hardware
# Default: 300 (optimized: 100)
tracker_max_targets_per_stream = 100

# Probation age (frames before a track is confirmed)
# Range: 1 to 20+ frames
# Number of frames a track must be detected before being confirmed as valid.
# Lower values confirm tracks faster, reducing state maintenance overhead.
# Phase 5 optimization: Reduced from 5 → 3 for faster track confirmation
# Default: 5 frames (optimized: 3)
tracker_probation_age = 3

# Early termination age (frames before terminating a track)
# Range: 1 to 10+ frames
# Number of frames without detection before a track is terminated.
# Higher values terminate tracks faster, reducing memory and computation.
# Phase 5 optimization: Increased from 1 → 2 for faster track cleanup
# Default: 1 frame (optimized: 2)
tracker_early_termination_age = 2

# Minimum tracker confidence threshold
# Range: 0.0 to 1.0
# Minimum confidence required for a track to be maintained.
# Higher values filter out weak tracks faster, reducing processing overhead.
# Phase 5 optimization: Increased from 0.8049 → 0.85 for better filtering
# Default: 0.8049 (optimized: 0.85)
tracker_min_confidence = 0.85

# Use prediction for association
# When enabled, uses motion prediction to improve track association accuracy.
# Disabling reduces computation overhead at the cost of slightly lower accuracy.
# Phase 5 optimization: Disabled (false) to reduce computation on weaker systems
# Default: true (optimized: false)
tracker_use_prediction_for_assoc = false

[Performance]
# PERFORMANCE OPTIMIZATION PARAMETERS
# These parameters control adaptive frame dropping to optimize performance when output pipelines are overloaded.
# Frame dropping helps maintain smooth operation by reducing input load when downstream processing cannot keep up.

# Enable adaptive frame dropping
# When enabled, the encoder will automatically drop frames when output pipelines (display, RTP, WebRTC)
# are running below the target FPS, indicating they are overloaded.
#
# Frame dropping behavior:
#   - I-frames (keyframes) are NEVER dropped to maintain stream decodability
#   - Only delta frames (P/B-frames) are dropped when pipelines are overloaded
#   - Dropping is adaptive and smooths out over time to avoid stuttering
#   - All active output pipelines are monitored and the minimum FPS is used
#
# Use cases:
#   true  - Enable adaptive frame dropping for overloaded pipelines
#   false - Disable frame dropping, process all frames (default)
#
# When to enable:
#   - Output pipelines consistently run below target FPS
#   - System resources are limited (CPU, GPU, memory)
#   - Network bandwidth is constrained (for RTP/WebRTC)
#   - You want to prioritize smooth playback over frame completeness
#
# When to disable:
#   - All frames must be processed (e.g., recording, analysis)
#   - System has sufficient resources
#   - Frame completeness is more important than smooth playback
#
# Default: false (disabled)
enable_frame_dropping = false

# Target FPS for output pipelines
# This is the desired frame rate for output pipelines (display, RTP, WebRTC).
# When any active pipeline runs below this value, frame dropping will be activated.
#
# Range: 1.0 to 120.0 FPS
# Typical values:
#   15.0  - Low frame rate (suitable for low-power systems)
#   24.0  - Cinema frame rate
#   25.0  - PAL video standard
#   30.0  - NTSC/HDTV standard (default, recommended)
#   60.0  - High frame rate (gaming, sports)
#   120.0 - Very high frame rate (high-end displays)
#
# The target FPS should match your expected output frame rate.
# If your input is 30 FPS and you want 30 FPS output, set to 30.0.
# If your input is 60 FPS but you only need 30 FPS output, set to 30.0.
#
# Note: Frame dropping only activates when actual FPS < target_fps.
# If pipelines are running at or above target FPS, no frames are dropped.
#
# Default: 30.0 FPS
target_fps = 30.0

# Drop smoothing factor for adaptive frame dropping
# Controls how quickly the frame dropping algorithm responds to FPS changes.
# This uses exponential moving average to smooth out FPS measurements and drop decisions.
#
# Range: 0.0 to 1.0
# Lower values (e.g., 0.05-0.1):
#   - More responsive to FPS changes
#   - Faster adaptation to pipeline load changes
#   - May cause more variable drop rates
#   - Recommended for dynamic workloads
#
# Higher values (e.g., 0.2-0.5):
#   - Slower to respond to FPS changes
#   - More stable drop rates over time
#   - Smoother frame dropping behavior
#   - Recommended for stable workloads
#
# Typical values:
#   0.05 - Very responsive (may be too sensitive)
#   0.1  - Responsive (default, recommended)
#   0.2  - Moderate smoothing
#   0.5  - Heavy smoothing (very stable)
#
# The smoothing factor determines the weight of new FPS measurements:
#   smoothed_fps = (smoothing_factor * current_fps) + ((1.0 - smoothing_factor) * smoothed_fps)
#
# Default: 0.1 (10% weight for new measurements, 90% for historical average)
drop_smoothing_factor = 0.1

# Enable dual-path DeepStream bypass feature
# When enabled, creates a dual-path pipeline with frame routing and merging capabilities.
# This allows selective bypassing of DeepStream inference to reduce GPU load while maintaining ROI data continuity.
#
# OVERVIEW:
# The bypass feature creates two parallel pipeline paths:
#   1. INFERENCE PATH: Full DeepStream processing (nvstreammux, nvinfer, nvtracker)
#   2. BYPASS PATH: Fast path with minimal processing (nvvidconv only)
#
# Frames are routed between paths based on bypass_interval, and a frame merger
# reorders frames by PTS to maintain proper frame ordering despite different latencies.
#
# Bypass frames reuse ROI data from the most recent inference frame, ensuring ROI
# continuity without running inference on every frame.
#
# Options:
#   true  - Enable dual-path bypass feature (uses polling-based appsink and frame merger)
#   false - Disable bypass feature, use single-path inference (default)
#
# When enabled:
#   - Both inference and bypass paths are created
#   - Frame router controls routing based on bypass_interval
#   - Frame merger reorders frames by PTS
#   - Polling threads retrieve frames from both appsinks
#
# When disabled:
#   - Only inference path is used (original behavior)
#   - Signal-based appsink callbacks are used
#   - All frames go through DeepStream inference
#
# Use cases:
#   true  - Reduce GPU load, improve performance when inference is bottleneck
#   false - Maximum ROI detection quality, all frames processed through inference
#
# Default: false (disabled)
enable_deepstream_bypass = false

# Bypass interval: Every Nth kept frame bypasses inference
# This parameter controls the routing pattern for frames that survive frame dropping.
# Frame dropping (controlled by enable_frame_dropping) happens FIRST, then routing
# decisions are made only for frames that were kept.
#
# Range: 0 to 10+
#   0 = Bypass disabled (all kept frames go through inference)
#   2 = Every 2nd kept frame bypasses (50% bypass rate, 50% GPU load)
#   3 = Every 3rd kept frame bypasses (33% bypass rate, 67% GPU load)
#   4 = Every 4th kept frame bypasses (25% bypass rate, 75% GPU load)
#   5 = Every 5th kept frame bypasses (20% bypass rate, 80% GPU load)
#
# Routing pattern:
#   bypass_interval = 2: frames 1, 3, 5, 7, ... bypass (every 2nd frame)
#   bypass_interval = 3: frames 2, 5, 8, 11, ... bypass (every 3rd frame)
#   bypass_interval = 4: frames 3, 7, 11, 15, ... bypass (every 4th frame)
#
# Note: The first frame (frame 0) always goes to inference to establish initial ROI data.
#
# ROI data freshness:
#   - Bypass frames use ROI data from the immediately preceding inference frame
#   - Maximum ROI age is always 1 frame (bypass frames are always preceded by inference)
#   - ROI positions may lag slightly but remain consistent
#
# Trade-offs:
#   Lower values (2-3):
#     - More aggressive GPU load reduction
#     - ROI positions may lag more on fast-moving objects
#     - Better for high frame rates or limited GPU resources
#
#   Higher values (4-5):
#     - More frames go through inference (better ROI accuracy)
#     - Higher GPU load but more accurate ROI positions
#     - Better for scenarios requiring precise ROI tracking
#
# Example scenarios:
#   - High frame rate (60 FPS), limited GPU: bypass_interval = 2 (50% reduction)
#   - Balanced performance: bypass_interval = 3 (33% reduction, recommended)
#   - Maximum quality: bypass_interval = 4 or higher (25% or less reduction)
#
# Default: 0 (bypass disabled)
bypass_interval = 2

# Frame merger buffer size (number of frames)
# Controls the size of the reorder buffer used to merge frames from both paths.
# The merger collects frames from inference and bypass appsinks and outputs them
# in PTS order despite different processing latencies.
#
# Range: 5 to 50+ frames
# Typical values:
#   5-10  - Small buffer, low latency, may cause ordering issues under load
#   10-20 - Balanced buffer size (recommended)
#   20-50 - Large buffer, higher latency, handles more variance
#
# Buffer sizing considerations:
#   - Inference path latency: ~30-60ms per frame
#   - Bypass path latency: ~3ms per frame
#   - Latency delta: ~27-57ms
#   - At 30 FPS (33ms/frame): ~1-2 frames difference
#   - At 60 FPS (16.7ms/frame): ~2-4 frames difference
#
# Buffer size calculation:
#   Required size = (max_latency_delta_ms / frame_time_ms) + safety_margin
#   Example: 50ms delta at 30 FPS = ceil(50/33) + 3 = 2 + 3 = 5 frames minimum
#
# Too small (< 5):
#   - May cause frame ordering issues
#   - Frequent timeout events
#   - Potential frame drops under load
#
# Too large (> 30):
#   - Higher memory usage
#   - Increased latency before output
#   - Unnecessary buffering overhead
#
# Default: 10 frames (handles typical latency variance with safety margin)
merger_buffer_size = 10

# Frame merger maximum latency before forcing output (milliseconds)
# Controls how long the merger waits for frames before giving up on perfect ordering.
# When this timeout is reached, the oldest frame in the buffer is output even if
# frames from both paths with higher PTS haven't arrived yet.
#
# Range: 20 to 1000+ milliseconds
# Typical values:
#   50-100  - Short timeout, faster output, may cause minor ordering issues
#   100-200 - Balanced timeout (recommended)
#   200-500 - Long timeout, waits longer for perfect ordering, higher latency
#
# Timeout behavior:
#   - When timeout is reached: oldest frame is output with a warning
#   - This handles cases where one path has unusually high latency
#   - Minor ordering issues may occur but are usually acceptable
#
# Too low (< 50ms):
#   - Frequent timeouts and warnings
#   - Unnecessary frame reordering
#   - May cause encoder hiccups
#
# Too high (> 500ms):
#   - Large buffer memory usage
#   - High latency before detecting path failures
#   - Delayed error detection
#
# Recommended: 100-200ms (covers typical inference latency variance)
# Default: 100 milliseconds
merger_max_latency_ms = 100

[Detection]
# OBJECT DETECTION PARAMETERS
# These parameters control the sensitivity and behavior of object detection algorithms.
# They affect the quality and quantity of detected objects that become ROIs.

# Base confidence threshold for object detection
# Range: 0.0 to 1.0 (0% to 100% confidence)
# This threshold determines the minimum confidence required for a detection to be considered valid
#
# Lower values (e.g., 0.01-0.3):
#   - Detect more objects (higher recall)
#   - May include false positives
#   - Useful for ensuring no important objects are missed
#
# Higher values (e.g., 0.5-0.9):
#   - Detect fewer objects (higher precision)
#   - Fewer false positives
#   - Useful for high-quality, reliable detections only
#
# Typical values:
#   0.01-0.1  - Very sensitive, detects many objects
#   0.3-0.5   - Balanced sensitivity
#   0.7-0.9   - High confidence only
base_confidence_threshold = 0.01

# Maximum number of frames to track missing objects before expiring them
# Range: 1 to 100+ frames
# This parameter controls how long the tracker maintains ROI information for objects that are temporarily not detected
#
# Lower values (e.g., 5-10):
#   - Objects disappear quickly when not detected
#   - Reduces memory usage
#   - May lose track of temporarily occluded objects
#
# Higher values (e.g., 20-50):
#   - Objects persist longer when not detected
#   - Better handling of temporary occlusions
#   - May maintain stale ROI information
#
# Typical values:
#   5-10   - Quick expiration, good for dynamic scenes
#   15-25  - Balanced persistence (recommended)
#   30-50  - Long persistence, good for stable scenes
# Default: 25 frames
maximum_missing_frames = 10

# Enable ROI prediction when tracker stops providing data
# When enabled, the application will continue predicting ROI positions
# even after the tracker stops providing updates
#
# This feature is useful when:
# - The tracker temporarily loses track of objects
# - Objects are temporarily occluded
# - The tracker needs time to re-acquire objects
# - Maintaining smooth ROI transitions
#
# Prediction behavior:
#   true  - Continue predicting ROI positions based on last known trajectory
#   false - Stop ROI processing when tracker data is unavailable
#
# Note: Prediction accuracy depends on object movement patterns
# and may not be suitable for all scenarios
enable_prediction = false

# ROI accumulation mode: how ROIs are matched and accumulated across frames
# Options:
#   "object_id" - Use tracker's object_id for matching (requires tracker, default)
#   "overlap"   - Use IOU-based overlap matching (doesn't require tracker)
#
# When set to "overlap":
#   - Tracker can be disabled (saves ~250ms latency)
#   - ROIs are matched by spatial overlap (IOU >= roi_overlap_threshold)
#   - Recursive matching handles transitive overlaps (A overlaps B, B overlaps C → A matches C)
#   - More flexible but less robust than object_id matching
#
# When set to "object_id":
#   - Requires tracker to provide consistent object_id values
#   - More robust matching across frames
#   - Better handling of occlusions and fast movement
#
# Default: "object_id"
roi_accumulation_mode = object_id

# Overlap threshold for IOU-based matching (only used when roi_accumulation_mode = "overlap")
# Range: 0.0 to 1.0 (0% to 100% overlap)
# Default: 0.33 (33% overlap)
#
# Lower values (e.g., 0.2-0.3):
#   - More lenient matching
#   - Better handling of fast movement
#   - May incorrectly merge separate objects
#
# Higher values (e.g., 0.5-0.7):
#   - Stricter matching
#   - Fewer false merges
#   - May lose track on fast movement
#
# Typical values:
#   0.25-0.33 - Balanced (recommended)
#   0.4-0.5   - Stricter matching
#   0.2-0.25  - More lenient matching
roi_overlap_threshold = 0.33

# Enable tracker element (only used when inference_engine = true)
# When false, nvinfer runs without nvtracker (saves ~250ms latency)
# Options:
#   true  - Enable tracker (default, provides object_id for ROI matching)
#   false - Disable tracker (requires roi_accumulation_mode = "overlap" for ROI matching)
#
# When disabled:
#   - Tracker element is not created
#   - Pipeline: streammux -> nvinfer -> nvvidconv2 -> appsink (no tracker)
#   - ROI matching uses overlap-based accumulation (if roi_accumulation_mode = "overlap")
#   - Significant latency reduction (~250ms)
#
# When enabled:
#   - Tracker element is created and configured
#   - Pipeline: streammux -> nvinfer -> tracker -> nvvidconv2 -> appsink
#   - ROI matching can use object_id-based accumulation (if roi_accumulation_mode = "object_id")
#   - More robust tracking but higher latency
#
# Recommendation:
#   - For weaker systems: enable_tracker = false, roi_accumulation_mode = "overlap"
#   - For maximum quality: enable_tracker = true, roi_accumulation_mode = "object_id"
#
# Default: true (enabled)
enable_tracker = true

[Stabilization]
# ROI STABILIZATION PARAMETERS
# These parameters apply only when inference_engine = true.
# Stabilization is not used for static ROI JSON or ROI data files.
#
# Enable/disable stabilization
# Options:
#   true  - Enable stabilization (default)
#   false - Disable stabilization
enabled = true
#
# Stabilization mode
# Options: none, ema, threshold, hybrid
# Default: hybrid
mode = hybrid
#
# Position smoothing factor (EMA)
# Range: 0.0 to 1.0
alpha = 0.3
#
# Size smoothing factor (EMA)
# Range: 0.0 to 1.0
alpha_size = 0.2
#
# Minimum pixel delta before updating position
min_position_delta = 3
#
# Minimum pixel delta before updating size
min_size_delta = 2
#
# Velocity influence on adaptive alpha (higher = more responsive to motion)
velocity_adaptive_factor = 0.5

[Debug]
# DEBUGGING AND VISUALIZATION PARAMETERS
# These parameters control debugging features and visual output for development and troubleshooting.
# They help visualize the processing pipeline and save intermediate results for analysis.
#
# NOTE: Display overlays (draw_borders/draw_fps/draw_bitrate/draw_bitrate_large) are temporarily disabled
# in the GPU pipeline due to NVMM buffer mapping errors. Enabling these flags currently has no effect.

# Enable border drawing for detected ROIs
# When enabled, blue borders are drawn around detected regions of interest
# This helps visualize:
#   - Which areas are being detected as ROIs
#   - The accuracy of object detection
#   - ROI boundaries and sizes
#
# Use cases:
#   true  - Development, debugging, visualization
#   false - Production, performance optimization
draw_borders = true

# Enable RTP timestamp overlay on decoded frames
# When enabled, displays the RTP timestamp extracted from incoming RTP packets
# on decoded video frames before encoding.
#
# The timestamp is displayed in the lower-left corner of the frame with:
#   - Dark gray background for better visibility
#   - White text showing the timestamp value
#
# This overlay is only available when input_type = "udp" (RTP stream input).
# The timestamp is extracted from the RTP packet headers and attached to decoded frames.
#
# Use cases:
#   true  - Debugging RTP stream synchronization, timestamp analysis
#   false - Production, reduces visual clutter (default)
#
# Note: This overlay is drawn on frames before encoding, so it will appear
# in all output branches (display, file, RTP, WebRTC).
# Default: false (disabled)
draw_rtp_timestamp = true

# Enable FPS overlay on display frames
# When enabled, displays the current frames per second (FPS) on display branch frames.
#
# The FPS is displayed in the top-right corner of the frame with:
#   - Dark gray background for better visibility
#   - White text showing the FPS value (e.g., "30.0 fps")
#
# The FPS is calculated from the display pipeline's frame processing rate.
# This overlay is only visible on the display branch output.
#
# Use cases:
#   true  - Monitoring display pipeline performance, debugging frame rate issues
#   false - Production, reduces visual clutter (default)
#
# Note: This overlay requires enable_display_branch = true to be visible.
# Default: false (disabled)
draw_fps = true

# Enable bitrate overlay on display frames
# When enabled, displays the incoming UDP/RTP bitrate on display branch frames.
#
# The bitrate is displayed in the lower-right corner of the frame with:
#   - Dark gray background for better visibility
#   - White text showing the bitrate (e.g., "1.5 Mbps" or "1500 kbps")
#
# The bitrate is calculated from incoming RTP/UDP packet sizes and timestamps.
# This overlay is only available when input_type = "udp" (RTP stream input).
# This overlay is only visible on the display branch output.
#
# Use cases:
#   true  - Monitoring incoming stream bitrate, debugging network issues
#   false - Production, reduces visual clutter (default)
#
# Note: This overlay requires enable_display_branch = true to be visible.
# If both draw_bitrate and draw_bitrate_large are enabled, draw_bitrate_large takes precedence.
# Default: false (disabled)
draw_bitrate = true

# Enable large red bitrate overlay on display frames
# When enabled, displays the incoming UDP/RTP bitrate in large red text (2x size).
#
# The bitrate is displayed in the lower-right corner of the frame with:
#   - White background for better visibility
#   - Large red text (2x normal size) showing the bitrate (e.g., "1.5 Mbps")
#
# The bitrate is calculated from incoming RTP/UDP packet sizes and timestamps.
# This overlay is only available when input_type = "udp" (RTP stream input).
# This overlay is only visible on the display branch output.
#
# Use cases:
#   true  - Prominent bitrate display for monitoring, presentations, demos
#   false - Production, reduces visual clutter (default)
#
# Note: This overlay requires enable_display_branch = true to be visible.
# If both draw_bitrate and draw_bitrate_large are enabled, draw_bitrate_large takes precedence.
# Default: false (disabled)
draw_bitrate_large = false

# Enable saving individual frames as PNG files for debugging
# When enabled, frames are saved to disk for offline analysis
#
# Saved files:
#   <output_root>/debug_frames/     - Processed frames with ROI overlays and borders
#   <output_root>/original_frames/  - Original input frames without processing
#
# File naming: frame_XXXXXX.png (where XXXXXX is the frame number)
#
# Use cases:
#   true  - Frame-by-frame analysis, debugging ROI processing
#   false - Production, reduces disk I/O overhead
#
# WARNING: This can generate large amounts of data quickly!
save_frames = false

# Enable debug output from ROI packer algorithms
# When enabled, provides verbose logging from rectangle packing algorithms
# This includes:
#   - Packing algorithm selection and parameters
#   - Rectangle placement decisions
#   - Packing efficiency metrics
#   - Algorithm performance statistics
#
# Use cases:
#   true  - Debugging packing algorithms, optimizing ROI layout
#   false - Production, reduces log verbosity
packer_logging = false

# Enable display branch in the output pipeline
# When enabled, creates a display branch that decodes and displays the encoded video
# This branch includes:
#   - H.265 parser to parse the encoded stream
#   - H.265 decoder to decode the video
#   - Video converter for format conversion
#   - Auto video sink for display
#
# Use cases:
#   true  - Development, debugging, visualization of encoded output
#   false - Production, headless operation, reduces resource usage
#
# Note: When disabled, the encoder will still produce file and MP4 outputs
enable_display_branch = true

# Enable MP4 file saving branch in the output pipeline
# When enabled, creates an MP4 branch that saves the encoded video as an MP4 file
# This branch includes:
#   - H.265 parser to parse the encoded stream
#   - MP4 muxer to create MP4 container format
#   - File sink to save the MP4 file
#
# Use cases:
#   true  - Development, debugging, MP4 file output for testing
#   false - Production, reduces resource usage, only raw H.265 file output
#
# Note: When disabled, the encoder will still produce raw H.265 file output
enable_mp4_branch = false

# Enable H.265 file saving branch in the output pipeline
# When enabled, creates an H.265 branch that saves the encoded video as a raw H.265 file
# This branch includes:
#   - Queue element for buffering
#   - File sink to save the raw H.265 file
#
# Use cases:
#   true  - Development, debugging, raw H.265 file output for testing
#   false - Production, minimal resource usage, no file output
#
# Note: When disabled, the encoder will not produce any file output
# This is useful for streaming-only scenarios or when using RTP output
enable_h265_branch = false

[Logging]
# LOGGING PARAMETERS
# These parameters control various logging features for debugging and monitoring.
#
# Note: Logging is controlled via the GST_DEBUG environment variable.
# See GStreamer documentation for details on setting debug levels.

# Enable status reporting
# When enabled, periodic status reports will be generated showing:
#   - Frame processing statistics (frames processed, encoded, output)
#   - Processing rates (FPS for processing, encoding, output)
#   - ROI statistics (objects detected, tracked, filtered)
#   - SEI message injection statistics
#   - Error counts and runtime information
#
# This is useful for:
#   - Monitoring application performance
#   - Tracking processing throughput
#   - Identifying performance bottlenecks
#   - Monitoring ROI processing efficiency
#   - Debugging performance issues
#
# Default: true (enabled)
# Set to false to disable status reporting
enable_status_reporter = true

# Enable performance monitoring
# When enabled, periodic performance monitoring reports will be generated showing:
#   - Frame processing times for each pipeline stage (inference, ROI detection, encoding, etc.)
#   - Cumulative statistics from the entire run (total frames, average, min, max times)
#   - Recent window statistics (P50, P95, P99 percentiles)
#   - Interval statistics (last reporting period for comparison)
#   - Performance summary at shutdown (slowest/fastest stages, total pipeline latency)
#
# Monitored stages:
#   - Inference: DeepStream inference pipeline (nvinfer + nvtracker)
#   - ROI Detection Processing: CPU processing thread for ROI detection and packing
#   - Encoding: GStreamer encoder (kvazaar) processing time
#   - Encoded Frame Processing: SEI injection thread processing time
#   - Input Decoding: Input pipeline decoding time (optional)
#   - Total Pipeline: End-to-end frame processing time (if PTS tracking available)
#
# This is useful for:
#   - Identifying performance bottlenecks in the pipeline
#   - Monitoring processing times for each stage
#   - Tracking performance trends over time
#   - Optimizing pipeline configuration
#   - Debugging performance issues
#
# Reports are generated every N seconds (controlled by performance_monitoring_interval_seconds)
# and include both cumulative statistics (entire run) and recent statistics (last interval).
# A final summary report is generated at shutdown with overall performance metrics.
#
# Default: false (disabled)
# Set to true to enable performance monitoring
enable_performance_monitoring = true

# Performance monitoring reporting interval in seconds
# Controls how often performance monitoring reports are generated.
#
# Range: 1 to 60+ seconds
# Typical values:
#   5   - Every 5 seconds (default, recommended)
#   10  - Every 10 seconds (less frequent, lower overhead)
#   1   - Every second (very frequent, higher overhead)
#
# The interval affects:
#   - How often reports are printed to the console
#   - The granularity of interval statistics
#   - The overhead of report generation
#
# Lower values (1-5 seconds):
#   - More frequent updates
#   - Better visibility into short-term performance changes
#   - Higher logging overhead
#
# Higher values (10-30 seconds):
#   - Less frequent updates
#   - Lower logging overhead
#   - May miss short-term performance spikes
#
# Note: Cumulative statistics always track the entire run regardless of interval.
# Only the interval statistics (last N seconds) are affected by this setting.
#
# Default: 5 seconds
performance_monitoring_interval_seconds = 5

[Communication]
# COMMUNICATION PARAMETERS
# These parameters configure the communication protocol for live video transmission.
# The encoder can stream encoded video over different transport protocols.
# This group controls RTP output (UDP transport) and WebRTC output (WebRTC transport).

# Transport type
# Options: rtp, webrtc
# Default: rtp
#
#   rtp    - RTP/UDP transport with binary protocol (default, backward compatible)
#   webrtc - WebRTC transport with signaling server
transport_type = rtp

# Communication server host address
# This is the destination IP address or hostname where the stream will be sent
#
# Common formats:
#   IP address: 127.0.0.1, 10.0.0.5
#   Hostname:    stream-server.local, encoder-client.company.com
#   Localhost:   127.0.0.1, localhost
#
# To disable communication streaming (disables RTP/WebRTC output):
#   - Leave empty: ""
#   - Set to empty string
host = 127.0.0.1

# Communication server port number
# This is the port number for the communication protocol
#
# Valid range: 1-65535
# Common ports: 5000-5010 (standard RTP range)
#
# To disable communication streaming (disables RTP/WebRTC output):
#   - Set to 0
#   - Set to any invalid port number
#
# Example configurations:
#   RTP local streaming: transport_type=rtp, host=127.0.0.1, port=5000
#   RTP network streaming: transport_type=rtp, host=127.0.0.1, port=5000
#   WebRTC streaming: transport_type=webrtc, host=127.0.0.1, port=5000
#   Disabled: host=, port=0
port = 5000

# Communication timeout in milliseconds
# Timeout for connection and message operations
# Default: 5000 (5 seconds)
timeout_ms = 5000

[WebRTC]
# WEBRTC PARAMETERS
# These parameters are only used when transport_type=webrtc

# Signaling server URL
# WebSocket URL for WebRTC signaling (e.g., ws://127.0.0.1:8080)
# Required when transport_type=webrtc
signaling_url = ws://127.0.0.1:8080

# STUN server URL (optional)
# STUN server for NAT traversal (e.g., stun:stun.l.google.com:19302)
# Leave empty to disable STUN
stun_server =

# TURN server URL (optional)
# TURN server for NAT traversal when STUN is insufficient
# Format: turn:host:port
# Leave empty to disable TURN
turn_server =

# TURN server username (optional)
# Required if turn_server is specified
turn_username =

# TURN server password (optional)
# Required if turn_server is specified
turn_password =

# ICE candidate timeout in milliseconds
# Timeout for ICE candidate gathering
# Default: 10000 (10 seconds)
ice_timeout_ms = 10000

# Enable data channels
# Enable WebRTC data channels for additional metadata exchange
# Default: false
enable_data_channels = false
