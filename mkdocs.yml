# VCAI HTML Documentation Manual
# Build: ./docs/build_manual.sh  (or: mkdocs build)
# Output: manual/
# Do not use "mkdocs serve": links to repo files (config, source) require
# viewing the built manual via file:// from the repo root.
#
# Theme: readthedocs (built-in). Replaces Material to avoid drawer/scrollwrap
# issues with large nav; sidebar is a normal scrolling column.

site_name: VCAI Manual
site_description: Book-like HTML documentation for Video Coding for AI Tasks (VCAI)
site_author: VCAI contributors

site_dir: manual
docs_dir: docs
use_directory_urls: false

# Disable search plugin: client-side search does not work when viewing via file://
# (browser blocks loading search index). Manual is intended for file:// from repo root.
plugins: []

# Widen main content (RTD default max-width 800px is too narrow for tables)
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11.5.0/dist/mermaid.min.js
  - javascripts/mermaid-init.js

theme:
  name: readthedocs
  highlightjs: true

markdown_extensions:
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - admonition
  - pymdownx.details

